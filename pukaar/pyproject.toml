[project]
name = "pukaar"
version = "0.1.0"
description = "Wayside - witness-powered street aid: WhatsApp-style intake agent, triage, kit orders, and nearest-trusted-responder dispatch, with a live demo control room."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
    "pywebpush>=2.0",
    # runtime transport for the WhatsApp Cloud API + Telegram bridge (the
    # dev extra alone left a clean prod install crashing at first send)
    "httpx>=0.27",
    # multipart parsing for the witness photo upload endpoint
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pukaar*"]

[tool.setuptools.package-data]
"pukaar.data" = ["*.geojson"]
pukaar = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
