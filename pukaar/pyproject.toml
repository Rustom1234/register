[project]
name = "pukaar"
version = "0.1.0"
description = "Pukaar - witness-powered street aid: WhatsApp-style intake agent, triage, kit orders, and nearest-trusted-responder dispatch, with a live demo control room."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pukaar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
